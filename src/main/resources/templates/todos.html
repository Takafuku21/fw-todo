<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <h1 class="page-title" th:text="${trash ? 'ごみ箱' : 'やること一覧'}">やること一覧</h1>

        <form class="search-bar" th:action="@{/todos}" method="get">
            <div class="form-row">
                <label class="form-label" for="keyword">やること</label>
                <input class="form-input" id="keyword" type="text" name="keyword" th:value="${keyword}">
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="すべて" th:selected="${category == 'すべて'}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </div>
            <input type="hidden" name="order" th:value="${order}">
            <input th:if="${trash}" type="hidden" name="trash" value="1">
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category == 'すべて' ? null : category}, order='asc', trash=${trash ? '1' : null})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category == 'すべて' ? null : category}, order='desc', trash=${trash ? '1' : null})}">期限が遠い順</a>
        </form>

        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash ? 'ごみ箱は空です' : 'まだ1件も登録されていません'}">まだ1件も登録されていません</p>

        <p>
            <a class="link" th:if="${!trash}" th:href="@{/todos/new}">新規登録</a>
            <a class="link" th:if="${!trash}" th:href="@{/calendar}">カレンダーで見る</a>
            <a class="link" th:if="${!trash}" th:href="@{/todos(trash=1)}">ごみ箱を見る</a>
            <a class="link" th:if="${trash}" th:href="@{/todos}">一覧に戻る</a>
        </p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>印</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:if="${!trash}">
                        <form th:action="@{/todos/{id}/pin(id=${todo.id}, keyword=${keyword}, category=${category == 'すべて' ? null : category}, order=${order}, page=${currentPage})}" method="post">
                            <button class="btn sub" type="submit" th:text="${todo.pinned ? '★ 印を外す' : '☆ 印を付ける'}">☆ 印を付ける</button>
                        </form>
                    </td>
                    <td th:if="${trash}" th:text="${todo.pinned ? '★' : '☆'}">印</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}">
                        <form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="btn" type="submit">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" aria-label="ページ移動" th:if="${totalPages > 1}">
            <a class="pagination-link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:href="@{/todos(page=${pageNumber}, keyword=${keyword}, category=${category == 'すべて' ? null : category}, order=${order}, trash=${trash ? '1' : null})}"
                th:text="${pageNumber}"
                th:classappend="${pageNumber == currentPage ? ' is-current' : ''}"
                th:attr="aria-current=${pageNumber == currentPage ? 'page' : null}">1</a>
        </nav>
    </div>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        document.querySelectorAll(".todo-table tr[data-due-date]").forEach(row => {
            if (row.dataset.dueDate < today && row.dataset.completed !== "true") {
                row.classList.add("is-overdue");
            }
        });
    </script>
</body>

</html>
